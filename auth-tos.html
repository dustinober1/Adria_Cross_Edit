<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accept Terms of Service - Adria Cross</title>
    <link rel="icon" href="/images/icon-152x152.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .tos-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 2rem;
            max-width: 500px;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #c19a5d;
            margin-bottom: 1.5rem;
        }

        h1 {
            color: white;
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        p {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        #status-message {
            color: #e74c3c;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
        }

        .btn-cta {
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-family: inherit;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary-cta {
            background: linear-gradient(135deg, #d4a574 0%, #c19a5d 100%);
            color: white;
        }

        .btn-primary-cta:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(193, 154, 93, 0.4);
        }

        .btn-primary-cta:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="tos-container">
        <img src="images/icon-144x144.webp" alt="Adria Cross Logo" class="logo">
        <h1>Almost There!</h1>
        <p>To complete your account setup, please accept the Terms of Service.</p>
        <div id="status-message"></div>
        <button id="show-tos-btn" class="btn-cta btn-primary-cta">Review Terms of Service</button>
    </div>

    <script src="js/tos-modal.js"></script>
    <script>
        document.getElementById('show-tos-btn').addEventListener('click', async function() {
            const btn = this;
            const statusEl = document.getElementById('status-message');
            btn.disabled = true;
            btn.textContent = 'Loading...';
            statusEl.style.display = 'none';

            try {
                const acceptedAt = await window.tosModal.show({
                    title: 'Terms of Service',
                    message: 'To complete your account setup, please read and accept the Terms of Service:'
                });

                // Send acceptance to server
                btn.textContent = 'Confirming...';
                const response = await fetch('/api/auth/accept-tos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tosAcceptedAt: acceptedAt })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    btn.textContent = 'Account Created! Redirecting...';
                    setTimeout(() => {
                        window.location.href = data.redirect || '/member-portal.html';
                    }, 1000);
                } else {
                    throw new Error(data.error || 'Failed to accept TOS');
                }
            } catch (err) {
                statusEl.textContent = err.message || 'Failed to accept Terms of Service';
                statusEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Review Terms of Service';
            }
        });
    </script>
</body>
</html>
